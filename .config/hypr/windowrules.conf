# Window Rules
# Syntax: windowrule = match:COND VAL, ..., RULE [VAL]
# Docs:   https://wiki.hypr.land/Configuring/Window-Rules/

# Fullscreen windows should be fully opaque
windowrule = match:fullscreen 1, opacity 1 override

# Application workspace assignments
windowrule = match:class ^(code)$, workspace 3 silent
windowrule = match:class ^(spotify)$, workspace 4 silent
windowrule = match:class ^(discord)$, workspace 2 silent
windowrule = match:class ^(steam)$, workspace 5 silent
windowrule = match:class ^(steam)$, center on

# Steam no-focus on empty-title windows
windowrule = match:class ^(steam)$, match:title ^()$, no_initial_focus on
windowrule = match:class ^(steam)$, match:title ^()$, min_size 1 1

# Steam games - fullscreen, no blur for performance
windowrule = match:class ^(steam_app_.*)$, fullscreen on
windowrule = match:class ^(steam_app_.*)$, center on
windowrule = match:class ^(steam_app_.*)$, float on
windowrule = match:class ^(steam_app_.*)$, monitor 0
windowrule = match:class ^(steam_app_.*)$, immediate on
windowrule = match:class ^(steam_app_.*)$, no_blur on
windowrule = match:class ^(steam_app_.*)$, opacity 1 override

# Float utility windows
windowrule = match:class ^(pavucontrol)$, float on
windowrule = match:class ^(nm-connection-editor)$, float on
windowrule = match:class ^(blueman-manager)$, float on
windowrule = match:class ^(gnome-calculator)$, float on
windowrule = match:class ^(org.gnome.Calculator)$, float on
windowrule = match:title ^(Picture-in-Picture)$, float on
windowrule = match:title ^(Picture-in-Picture)$, pin on
windowrule = match:title ^(Open File)$, float on
windowrule = match:title ^(Save File)$, float on
windowrule = match:title ^(Confirm to replace files)$, float on
windowrule = match:title ^(File Operation Progress)$, float on
windowrule = match:class ^(xdg-desktop-portal-gtk)$, float on
windowrule = match:class ^(org.kde.polkit-kde-authentication-agent-1)$, float on
windowrule = match:class ^(polkit-gnome-authentication-agent-1)$, float on

# Browser fixes
windowrule = match:class ^(zen-alpha)$, match:title ^(Library)$, float on
windowrule = match:class ^(firefox)$, match:title ^(Library)$, float on
windowrule = match:class ^(zen-alpha)$, idle_inhibit fullscreen
windowrule = match:class ^(firefox)$, idle_inhibit fullscreen

# Image viewer
windowrule = match:class ^(imv)$, float on
windowrule = match:class ^(imv)$, size 1200 800
windowrule = match:class ^(imv)$, center on

# Suppress maximize requests
windowrule = match:class .*, suppress_event maximize

# Fix XWayland dragging issues (matches empty class/title on xwayland floating windows)
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_initial_focus = on
}

# Layer rules for blur
layerrule = match:namespace = waybar, blur 1
layerrule = match:namespace = waybar, blur_popups 1
layerrule = match:namespace = waybar, ignore_alpha 0

layerrule = match:namespace = rofi, blur 1
layerrule = match:namespace = rofi, blur_popups 1
layerrule = match:namespace = rofi, ignore_alpha 0

layerrule = match:namespace = notifications, blur 1
layerrule = match:namespace = notifications, blur_popups 1
layerrule = match:namespace = notifications, ignore_alpha 0
