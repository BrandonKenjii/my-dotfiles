# Autostart

# Core system services
exec-once = hypridle
exec-once = ~/.config/hypr/scripts/screen-rotate.sh
exec-once = env GDK_SCALE=1 waybar
exec-once = sleep 2 && cd ~/.config/ags && ags run app.tsx
exec-once = dunst
exec-once = ~/.config/hypr/scripts/swww-init.sh
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = easyeffects --gapplication-service
exec-once = ~/.config/dunst/scripts/spotify-dbus-monitor.sh

# Clipboard manager
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# DBus/systemd environment
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# User applications
#exec-once = zen-browser
exec-once = sleep 3 && kitty
#exec-once = [workspace 2 silent] discord --enable-features=WaylandWindowDecorations --ozone-platform-hint=auto
#exec-once = spotify-launcher
#exec-once = [workspace 5 silent] STEAM_FORCE_X11=1 GDK_SCALE=2 steam --window-size=960,540
exec-once = sleep 3 && hyprctl dispatch swapwindow l
exec-once = pactl set-default-sink alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Speaker__sink
