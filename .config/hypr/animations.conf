# Animations

# Enable animations
animations {
    enabled = true

    # Bezier curves
    bezier = easeOut, 0.25, 1, 0.5, 1
    bezier = easeInOut, 0.76, 0, 0.24, 1
    bezier = bounce, 0.34, 1.56, 0.64, 1
    bezier = smooth, 0.4, 0, 0.2, 1
    bezier = snappy, 0.17, 0.17, 0, 1

    # Window animations
    animation = windows, 1, 4, easeOut, slide
    animation = windowsOut, 1, 4, easeInOut, slide
    animation = windowsMove, 1, 4, easeOut, slide

    # Workspace switch animation (windows slide left/right)
    animation = workspaces, 1, 5, easeOut, slide

    # Fade in/out
    animation = fade, 1, 4, easeOut
    animation = fadeOut, 1, 3, easeInOut

    # Border color transition
    animation = border, 1, 6, easeOut
    animation = borderangle, 1, 100, easeOut, loop

    # Layer animations (waybar, notifications, etc.)
    animation = layers, 1, 3, easeOut, fade
    animation = layersOut, 1, 2, easeInOut, fade
}

